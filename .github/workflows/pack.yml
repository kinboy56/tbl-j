name: pack

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: pokeldn ref that provides scripts/pack_plugin.py
        default: main

permissions:
  contents: write

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: src
      - uses: actions/checkout@v7
        with:
          repository: Decryptu/pokeldn
          ref: ${{ inputs.upstream_ref || 'main' }}
          path: upstream
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # The repo root also holds README, LICENSE and .github, which must not end up in the package.
      - run: |
          mkdir stage out
          cp -r src/plugin.toml src/strings.toml src/docs stage/
          cd out && python ../upstream/scripts/pack_plugin.py ../stage
      - uses: actions/upload-artifact@v7
        with:
          name: pokeplugin
          path: out/*.pokeplugin
      - if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.pokeplugin --draft --title "$GITHUB_REF_NAME" --notes "" -R "$GITHUB_REPOSITORY"
